# Full offline dbt build + test on every push/PR. Possible because the raw
# layer ships as committed seeds — no warehouse credentials, no API key.
# (My Medicare project's CI could only `dbt parse`; this is the same
# principle, strengthened where the data allows it.)
name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync environment
        run: uv sync

      - name: Configure profile
        run: cp profiles.yml.example profiles.yml

      - name: dbt deps
        run: uv run dbt deps --profiles-dir .

      - name: dbt build (seeds + models + tests)
        run: uv run dbt build --profiles-dir .
